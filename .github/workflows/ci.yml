name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders only: the build needs the variables to exist, not to be valid credentials.
      DATABASE_URL: postgresql://user:password@localhost:5432/reelforge
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      # shortcut: package-lock.json predates the test and lint dev dependencies, so `npm ci`
      # would fail. Switch back to `npm ci` after regenerating the lockfile with `npm install`.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
